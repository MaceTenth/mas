[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mas"
version = "0.1.0"
description = "mas — a multi-agent environment: durable board, worktree compartments, pluggable workers, verification gates, and restartable orchestration."
requires-python = ">=3.11"
dependencies = ["anthropic>=1.0", "rich>=13", "google-genai>=1.0", "openai>=2.0"]

[project.scripts]
mas = "mas.cli:main"

[tool.setuptools.packages.find]
include = ["mas*"]

[tool.setuptools.package-data]
mas = ["demo_target/**/*", "demo_vote/**/*", "demo_vote/target/.gitignore", "demo_review/**/*", "demo_review/target/.gitignore", "demo_advisor/**/*", "demo_advisor/target/.gitignore", "demo_recovery/**/*", "demo_recovery/target/.gitignore"]
